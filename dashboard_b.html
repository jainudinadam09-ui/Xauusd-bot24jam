function calcRSI(prices, period=9){
 if(prices.length<period+1) return 50;
 let gains=0, losses=0;
 for(let i=prices.length-period;i<prices.length;i++){
   let d=prices[i]-prices[i-1];
   if(d>=0) gains+=d; else losses-=d;
 }
 if(losses===0) return 100;
 return 100 - (100/(1+gains/losses));
}
function calcEMA(prices, period){
 if(prices.length===0) return 0;
 let k=2/(period+1); let ema=prices[0];
 for(let i=1;i<prices.length;i++) ema=prices[i]*k + ema*(1-k);
 return ema;
}
function calcATR(prices, period=14){
 if(prices.length<period+1) return 3;
 let sum=0;
 for(let i=prices.length-period;i<prices.length;i++) sum+=Math.abs(prices[i]-prices[i-1]);
 return sum/period;
}
function calcMACD(prices){
 return calcEMA(prices.slice(-30),12) - calcEMA(prices.slice(-30),26);
}

function drawCandleChart(data){
 try{
  let cv=document.getElementById('candleChart'); if(!cv||!data||data.length<5) return;
  let ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  let d=data.slice(-40);
  let ohlc=d.map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4])}));
  let hi=Math.max.apply(null,ohlc.map(x=>x.h)), lo=Math.min.apply(null,ohlc.map(x=>x.l));
  let pad=(hi-lo)*0.08||1; hi+=pad; lo-=pad;
  let n=ohlc.length, cw=W/n, bw=Math.max(2,cw*0.6);
  ctx.strokeStyle='#1c1c1c'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){let y=H*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();}
  ohlc.forEach((c,i)=>{
   let x=i*cw+cw/2;
   let yO=H-(c.o-lo)/(hi-lo)*H, yC=H-(c.c-lo)/(hi-lo)*H;
   let yH=H-(c.h-lo)/(hi-lo)*H, yL=H-(c.l-lo)/(hi-lo)*H;
   let bull=c.c>=c.o;
   ctx.strokeStyle=bull?'#00ff9d':'#ff3b3b'; ctx.fillStyle=bull?'#00ff9d':'#ff3b3b';
   ctx.lineWidth=Math.max(1,bw*0.18);
   ctx.beginPath(); ctx.moveTo(x,yH); ctx.lineTo(x,yL); ctx.stroke();
   let top=Math.min(yO,yC), hh=Math.max(2,Math.abs(yC-yO));
   ctx.fillRect(x-bw/2, top, bw, hh);
  });
  let last=ohlc[ohlc.length-1].c, yL=H-(last-lo)/(hi-lo)*H;
  ctx.fillStyle='#D4AF37'; ctx.font='bold 11px system-ui';
  ctx.fillText('$'+last.toFixed(0), 6, Math.max(12,yL-4));
  let info=document.getElementById('candleChartInfo');
  if(info) info.innerHTML=d.length+' candle 15M terakhir - Binance Real - '+new Date().toLocaleTimeString('id-ID');
 }catch(e){}
}
function predictNext(o){
 try{
  let votes=0, why=[];
  if(o.sig=='BUY'){votes+=2;why.push('Signal BUY');}
  else if(o.sig=='SELL'){votes-=2;why.push('Signal SELL');}
  if(o.score>0.6){votes+=1;why.push('Score +');}
  else if(o.score<-0.6){votes-=1;why.push('Score -');}
  if(kline15m.length>=6){let s=kline15m[kline15m.length-1]-kline15m[kline15m.length-6]; if(s>0){votes+=1;why.push('Momentum 15M naik');} else if(s<0){votes-=1;why.push('Momentum 15M turun');}}
  else if(priceHist.length>=31){let s=priceHist[priceHist.length-1]-priceHist[priceHist.length-31]; if(s>0){votes+=1;why.push('Momentum naik');} else if(s<0){votes-=1;why.push('Momentum turun');}}
  if(o.price>o.ema20){votes+=1;why.push('Harga>EMA20');} else if(o.price<o.ema20){votes-=1;why.push('Harga<EMA20');}
  if(o.rsi>55){votes+=0.5;} else if(o.rsi<45){votes-=0.5;}
  let dir='NETRAL', emoji='➡️';
  if(votes>=1.5){dir='NAIK';emoji='\uD83D\uDFE2';} else if(votes<=-1.5){dir='TURUN';emoji='\uD83D\uDD34';}
  let pconf=Math.min(90,Math.max(45,55+Math.abs(votes)*8));
  return {dir:dir,emoji:emoji,conf:pconf,why:why.join(' + ')||'Netral'};
 }catch(e){return {dir:'NETRAL',emoji:'➡️',conf:50,why:'-'};}
}
